name = "questline"
main = "src/worker.js"
compatibility_date = "2024-11-06"

# The app itself (index.html, manifest, service worker, icons) is uploaded
# from ./public and served for every non-/api path.
[assets]
directory = "./public"
binding = "ASSETS"
# Route every request through the Worker instead of letting the CDN answer
# static files directly, so security headers (frame-ancestors, nosniff) are
# actually attached to the app's own HTML.
run_worker_first = true

# Shared state lives here. Create it once with:
#   npx wrangler kv namespace create STATE
# then paste the printed id below.
[[kv_namespaces]]
binding = "STATE"
id = "14dc9d83ae954d748a8bb8d8c72b7b9d"
